name: Run daily arxiv

on:
  schedule:
    # Runs daily at 1 PM UTC (weekdays only - arxiv doesn't update on weekends)
    - cron:  '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run main
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        S2_KEY: ${{ secrets.S2_KEY }}
        PYTHONIOENCODING: utf-8
        LC_ALL: C.UTF-8
        LANG: C.UTF-8
      run: |
        python main.py
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: arxiv-scanner-outputs
        path: out/
        retention-days: 5
    - name: Save daily archive and commit
      run: |
        TODAY=$(date -u '+%Y-%m-%d')
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        # Guard against silent staleness: only archive/commit when main.py actually
        # refreshed the digest. If out/output.* is unchanged, the arxiv fetch returned
        # 0 papers (e.g. an RSS host/format change) -- fail loudly instead of committing
        # a stale copy under today's date and masking the breakage as a green run.
        git add -f out/output.json out/output.md
        if git diff --cached --quiet; then
          echo "::error::out/output.* unchanged -- main.py fetched 0 new papers. Refusing to commit a stale copy. Check the arxiv RSS feed (host/format change?)."
          exit 1
        fi
        # New content: snapshot into a date-stamped archive and commit.
        mkdir -p papers/$TODAY
        cp out/output.json papers/$TODAY/
        cp out/output.md papers/$TODAY/
        git add -f papers/$TODAY/
        git commit -m "Papers for $TODAY"
        git pull --rebase origin main
        git push
