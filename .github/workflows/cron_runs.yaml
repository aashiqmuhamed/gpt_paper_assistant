name: Run daily arxiv

on:
  schedule:
    # Runs daily at 1 PM UTC (weekdays only - arxiv doesn't update on weekends)
    - cron:  '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run main
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        S2_KEY: ${{ secrets.S2_KEY }}
        PYTHONIOENCODING: utf-8
        LC_ALL: C.UTF-8
        LANG: C.UTF-8
      run: |
        python main.py
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: arxiv-scanner-outputs
        path: out/
        retention-days: 5
    - name: Save daily archive and commit
      run: |
        TODAY=$(date -u '+%Y-%m-%d')
        # Create date-stamped archive directory
        mkdir -p papers/$TODAY
        # Copy outputs to archive
        if [ -f out/output.json ]; then
          cp out/output.json papers/$TODAY/
        fi
        if [ -f out/output.md ]; then
          cp out/output.md papers/$TODAY/
        fi
        # Commit and push if there are changes
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add out/output.json out/output.md papers/$TODAY/
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Papers for $TODAY"
          git pull --rebase origin main
          git push
        fi
