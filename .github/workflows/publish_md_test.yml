name: Publish output MD to github pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Run daily arxiv", "Backfill arxiv papers"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # The daily cron commits papers/<date>/output.json before this workflow
    # triggers, so the checkout already contains every day's data — no
    # artifact download needed.
    - name: Render HTML digest from papers archive
      run: python3 render_html.py --papers-dir papers --out dist
    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist
    - uses: actions/deploy-pages@v4
      id: deployment
