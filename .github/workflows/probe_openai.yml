name: OpenAI credit probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: One-shot gpt-4.1-mini call (checks OpenAI credit balance)
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        pip install -q "litellm==1.96.2" "openai==2.54.0"
        python -c "from litellm import completion; r=completion(model='gpt-4.1-mini', messages=[{'role':'user','content':'ping'}], max_tokens=1); print('CREDITS_OK', repr(r.choices[0].message.content))"
