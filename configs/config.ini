[SELECTION]
author_match_score = 15.0
run_openai = true
# Using LiteLLM - supports both OpenAI and Claude models
# Claude models (recommended):
model = claude-3-7-sonnet-20250219
# Alternative Claude models (if one is overloaded, try another):
#model = claude-sonnet-4-5-20250929
#model = claude-sonnet-4-20250514
#model = claude-3-opus-20240229
#model = claude-3-haiku-20240307
# OpenAI models (also supported):
#model = gpt-4-1106-preview
#model = gpt-4
#model = gpt-3.5-turbo
# cost quality tradeoff - larger batches are cheaper but less accurate.
batch_size = 5

[FILTERING]
arxiv_category = cs.CL,cs.LG,cs.AI
# force_primary ignores papers that are only cross-listed into the arxiv_category
force_primary = true
# draws num_samples samples from the LM and averages scores
num_samples = 1
hcutoff = 15
relevance_cutoff = 3
novelty_cutoff = 3
# whether to do author matching
author_match = true

[OUTPUT]
debug_messages = true
dump_debug_file = true
output_path = out/
# options: json, md
dump_json = true
dump_md = true